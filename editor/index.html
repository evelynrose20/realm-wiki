<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm Wiki Editor</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color-scheme:dark;background:#0c1721;color:#dce8ee}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:12px;padding:16px 22px;background:#122738;border-bottom:1px solid #355163}h1{font-size:20px;margin:0 30px 0 0;color:#e5ca91}button{cursor:pointer;background:#28485b;color:#e4eff5;border:1px solid #48687b;border-radius:5px;padding:9px 13px;font:inherit}button:hover{background:#385f74}button.primary{background:#bfa06a;color:#192a35;border-color:#d8ba83;font-weight:700}button:disabled{opacity:.5;cursor:default}#path{font-size:11px;color:#98afbd;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}main{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 70px)}nav{overflow-y:auto;background:#112431;border-right:1px solid #314d5c;padding:18px 12px}nav h3{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:#b7a27f;margin:15px 9px}nav button{display:block;width:100%;margin:5px 0;text-align:left;background:transparent;border:0;color:#c0d2db}nav button.active,nav button:hover{background:#263f50}.work{overflow-y:auto;padding:27px 35px 60px;max-width:1100px;width:100%}.work h2{font:25px Georgia,serif;margin:0 0 12px}.hint{color:#a3bdc9;font-size:12px;line-height:1.6}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0 25px}.field{margin:0 0 16px}label{font-size:12px;font-weight:700;display:block;margin-bottom:7px;color:#a8c2d0}input,textarea,select{width:100%;padding:11px;background:#152b3a;border:1px solid #3e5a6b;border-radius:5px;color:#e8f1f4;font:inherit}textarea{min-height:110px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section{padding:18px;margin:16px 0;border:1px solid #385363;border-radius:6px;background:#142939}.section h3{margin-top:0}.muted{color:#9ab1bc}.warning{color:#e3c18a}#status{margin-left:auto;font-size:12px;color:#9dc7ad} .secondary{background:#223747} .danger{border-color:#a46d6d;color:#efb3b3}@media(max-width:950px){main{grid-template-columns:205px 1fr}.work{padding:20px}.field-row{grid-template-columns:1fr}}
</style></head><body><header><h1>✧ Realm Wiki Editor</h1><button id="open">Open wiki folder</button><button id="reload" disabled>Reload</button><button id="preview" disabled>Preview</button><button id="save" class="primary" disabled>Save changes</button><span id="status">Open your GitHub clone</span></header><main><nav><h3>Manage</h3><button data-tab="site" class="active">Site &amp; homepage</button><button data-tab="articles">Articles</button><button data-tab="patches">Patches &amp; sub-patches</button><button data-tab="navigation">Navigation &amp; categories</button><h3>Wiki folder</h3><div id="path" class="muted">No folder selected</div></nav><div class="work" id="editor"><h2>Welcome</h2><p>Select your local <strong>realm-wiki</strong> repository folder to edit its real content. Changes are saved to <code>data/content.js</code>, then published with GitHub Desktop.</p></div></main>
<script>
(()=>{'use strict';let data=null,tab='site',selected=0,subSelected=0,changed=false;const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const field=(label,value,key,multi=false)=>'<div class="field"><label>'+esc(label)+'</label>'+(multi?'<textarea data-key="'+esc(key)+'">'+esc(value)+'</textarea>':'<input data-key="'+esc(key)+'" value="'+esc(value)+'">')+'</div>';const pick=(items,idx,label)=>'<select id="picker">'+items.map((v,i)=>'<option value="'+i+'" '+(i===idx?'selected':'')+'>'+esc(label(v))+'</option>').join('')+'</select>';const note=t=>el('status').textContent=t;
function render(){if(!data)return;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';
 if(tab==='site'){out='<h2>Site &amp; homepage</h2><p class="hint">Edit the wiki branding and featured patch, followed by homepage cards and notices.</p>';out+='<div class="section"><h3>Website settings</h3>'+Object.entries(data.site).map(([k,v])=>field(k,v,'site.'+k,k==='patchSummary')).join('')+'</div>';for(const [key,title] of [['highlights','Featured guides'],['notices','News & updates'],['events','Events & milestones']]){out+='<div class="section"><h3>'+title+'</h3><div class="controls"><button data-add="'+key+'">Add entry</button></div>';data[key].forEach((x,i)=>{out+='<details><summary>'+esc(x.title||x.name||'Entry '+(i+1))+'</summary>'+Object.entries(x).map(([k,v])=>field(k,v,key+'.'+i+'.'+k,k==='desc')).join('')+'<button class="danger" data-remove="'+key+'" data-index="'+i+'">Remove</button></details>'}) ;out+='</div>'}}
 if(tab==='articles'){out='<h2>Articles</h2><p class="hint">Edit existing articles, add structured sections and infobox data, or create new pages.</p><div class="controls"><button id="add-article">New article</button><button id="delete-article" class="danger">Delete selected</button></div>'+pick(data.articles,selected,a=>a.title);const a=data.articles[selected];if(a){out+='<div class="section">'+['title','slug','category','excerpt','lead'].map(k=>field(k,a[k],'articles.'+selected+'.'+k,k==='lead')).join('')+'<h3>Sections</h3><button id="add-section">Add section</button>';a.sections.forEach((x,i)=>{out+='<div class="section">'+field('Heading',x.heading,'articles.'+selected+'.sections.'+i+'.heading')+field('Text',x.text,'articles.'+selected+'.sections.'+i+'.text',true)+'<button class="danger" data-section-remove="'+i+'">Remove section</button></div>'});out+='<h3>Infobox</h3><p class="hint">JSON object with label/value pairs.</p>'+field('Infobox (JSON)',JSON.stringify(a.infobox||{},null,2),'_infobox',true)+field('Related slugs (one per line)',(a.related||[]).join('\n'),'_related',true)+'</div>'}}
 if(tab==='patches'){out='<h2>Patches &amp; sub-patches</h2><p class="hint">All entries power both the patch directory and individual patch pages.</p><div class="controls"><button id="add-era">Add era</button></div>'+pick(data.patchCatalog,selected,e=>e.title);const era=data.patchCatalog[selected];if(era){out+='<div class="section">'+field('Era ID',era.id,'patchCatalog.'+selected+'.id')+field('Era title',era.title,'patchCatalog.'+selected+'.title')+field('Era description',era.description,'patchCatalog.'+selected+'.description',true)+'<button class="danger" id="delete-era">Delete era</button><h3>Versions</h3><button id="add-patch">Add major patch</button>';era.entries.forEach((p,i)=>{out+='<details '+(subSelected===i?'open':'')+'><summary>Patch '+esc(p.version)+' — '+esc(p.title)+'</summary><div class="section">'+['version','title','summary','date','status'].map(k=>field(k,p[k]||'','patchCatalog.'+selected+'.entries.'+i+'.'+k,k==='summary')).join('')+'<h3>Sub-patches</h3><button data-add-sub="'+i+'">Add sub-patch</button>';p.subpatches.forEach((sub,j)=>{out+='<div class="section">'+field('Version',sub.version,'patchCatalog.'+selected+'.entries.'+i+'.subpatches.'+j+'.version')+field('Date',sub.date,'patchCatalog.'+selected+'.entries.'+i+'.subpatches.'+j+'.date')+'<button class="danger" data-remove-sub="'+i+'" data-index="'+j+'">Remove</button></div>'});out+='<button class="danger" data-remove-patch="'+i+'">Delete patch</button></div></details>'});out+='</div>'}}
 if(tab==='navigation'){out='<h2>Navigation &amp; categories</h2><p class="hint">These links form the sidebar and homepage browse sections.</p><button id="add-group">Add group</button>';data.groups.forEach((g,i)=>{out+='<div class="section">'+field('Group',g.name,'groups.'+i+'.name')+field('Icon',g.icon,'groups.'+i+'.icon')+field('Links (one Title|slug per line)',g.items.map(x=>x.join('|')).join('\n'),'_group_'+i,true)+'<button class="danger" data-remove-group="'+i+'">Remove group</button></div>'})}
 el('editor').innerHTML=out;bind()}
 function setKey(k,val){const parts=k.split('.');let obj=data;for(const p of parts.slice(0,-1))obj=obj[p];obj[parts.at(-1)]=val;changed=true;note('Unsaved changes')}
 function bind(){el('editor').querySelectorAll('[data-key]').forEach(node=>node.addEventListener('input',()=>{const k=node.dataset.key;try{if(k==='_infobox'){data.articles[selected].infobox=JSON.parse(node.value||'{}')}else if(k==='_related'){data.articles[selected].related=node.value.split('\n').map(s=>s.trim()).filter(Boolean)}else if(k.startsWith('_group_')){data.groups[Number(k.slice(7))].items=node.value.split('\n').filter(Boolean).map(s=>{const i=s.indexOf('|');return i<0?[s.trim(),s.trim().toLowerCase().replace(/\s+/g,'-')]:[s.slice(0,i).trim(),s.slice(i+1).trim()]})}else setKey(k,node.value);changed=true;note('Unsaved changes')}catch(e){note('Invalid JSON in infobox; fix before saving')}}));const picker=el('picker');if(picker)picker.onchange=()=>{selected=Number(picker.value);render()};const button=(id,fn)=>{const b=el(id);if(b)b.onclick=fn};
 button('add-article',()=>{data.articles.push({slug:'new-article-'+Date.now(),title:'New Article',category:'General',excerpt:'',lead:'',sections:[],related:[]});selected=data.articles.length-1;changed=true;render()});
 button('delete-article',()=>{if(!confirm('Delete this article?'))return;data.articles.splice(selected,1);selected=Math.max(0,selected-1);changed=true;render()});
 button('add-section',()=>{data.articles[selected].sections.push({heading:'New section',text:''});changed=true;render()});
 button('add-era',()=>{data.patchCatalog.push({id:'era-'+Date.now(),title:'New Era',description:'',entries:[]});selected=data.patchCatalog.length-1;changed=true;render()});
 button('delete-era',()=>{if(confirm('Delete this era and its patches?')){data.patchCatalog.splice(selected,1);selected=0;changed=true;render()}});
 button('add-patch',()=>{data.patchCatalog[selected].entries.push({version:'0.0',title:'New Patch',summary:'',date:'Not announced',status:'Planned',subpatches:[]});changed=true;render()});
 button('add-group',()=>{data.groups.push({name:'New Group',icon:'✦',items:[]});changed=true;render()});
 el('editor').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const key=b.dataset.add;const sample={highlights:{title:'New guide',tag:'FEATURE',desc:'',link:'about'},notices:{date:'PREVIEW',title:'New update',desc:'',link:'patches'},events:{label:'Development',name:'New milestone',status:'Planned',link:'patches'}};data[key].push(sample[key]);changed=true;render()});
 el('editor').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{data[b.dataset.remove].splice(Number(b.dataset.index),1);changed=true;render()});
 el('editor').querySelectorAll('[data-section-remove]').forEach(b=>b.onclick=()=>{data.articles[selected].sections.splice(Number(b.dataset.sectionRemove),1);changed=true;render()});
 el('editor').querySelectorAll('[data-add-sub]').forEach(b=>b.onclick=()=>{data.patchCatalog[selected].entries[Number(b.dataset.addSub)].subpatches.push({version:'0.0.1',date:'Not announced'});changed=true;render()});
 el('editor').querySelectorAll('[data-remove-sub]').forEach(b=>b.onclick=()=>{data.patchCatalog[selected].entries[Number(b.dataset.removeSub)].subpatches.splice(Number(b.dataset.index),1);changed=true;render()});
 el('editor').querySelectorAll('[data-remove-patch]').forEach(b=>b.onclick=()=>{if(confirm('Delete this patch and its sub-patches?')){data.patchCatalog[selected].entries.splice(Number(b.dataset.removePatch),1);changed=true;render()}});
 el('editor').querySelectorAll('[data-remove-group]').forEach(b=>b.onclick=()=>{data.groups.splice(Number(b.dataset.removeGroup),1);changed=true;render()});
 }
 async function run(fn){try{await fn()}catch(e){note('Error: '+e.message);alert(e.message)}}
 el('open').onclick=()=>run(async()=>{const r=await window.wiki.open();if(!r)return;data=r.data;changed=false;selected=0;el('path').textContent=r.folder;for(const id of ['reload','preview','save'])el(id).disabled=false;render();note('Wiki loaded')});
 el('reload').onclick=()=>run(async()=>{if(changed&&!confirm('Discard unsaved changes?'))return;data=await window.wiki.load();changed=false;selected=0;render();note('Reloaded')});
 el('save').onclick=()=>run(async()=>{const seen=new Set();for(const a of data.articles){if(!a.slug||seen.has(a.slug))throw Error('Every article needs a unique slug');seen.add(a.slug)}const versions=new Set();for(const era of data.patchCatalog)for(const p of era.entries)for(const v of [p.version,...p.subpatches.map(x=>x.version)]){if(versions.has(v))throw Error('Duplicate patch version: '+v);versions.add(v)}const r=await window.wiki.save(data);changed=false;note('Saved, backup created — commit in GitHub Desktop')});
 el('preview').onclick=()=>run(async()=>{await window.wiki.preview();note('Opened wiki preview')});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selected=0;render()});
 window.onbeforeunload=e=>{if(changed){e.preventDefault();e.returnValue=''}};
})();
</script></body></html>
